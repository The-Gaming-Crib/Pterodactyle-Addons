name: build-deskforge
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['eggs/DeskForge/images/**', '.github/workflows/build-deskforge.yml']
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { tag: ubuntu-26-xfce, dir: ubuntu, file: debian, base: "ubuntu:26.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: ubuntu-26-mate, dir: ubuntu, file: debian, base: "ubuntu:26.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: ubuntu-26-lxqt, dir: ubuntu, file: debian, base: "ubuntu:26.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: ubuntu-24-xfce, dir: ubuntu, file: debian, base: "ubuntu:24.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: ubuntu-24-xfce-games, dir: ubuntu, file: debian, base: "ubuntu:24.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "GAMES=yes" --build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: ubuntu-24-kde, dir: ubuntu, file: debian, base: "ubuntu:24.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: ubuntu-24-mate, dir: ubuntu, file: debian, base: "ubuntu:24.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: ubuntu-24-lxqt, dir: ubuntu, file: debian, base: "ubuntu:24.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: ubuntu-22-xfce, dir: ubuntu, file: debian, base: "ubuntu:22.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: ubuntu-20-xfce, dir: ubuntu, file: debian, base: "ubuntu:20.04", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: debian-13-xfce, dir: debian, file: debian, base: "debian:trixie-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: debian-13-kde, dir: debian, file: debian, base: "debian:trixie-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: debian-13-mate, dir: debian, file: debian, base: "debian:trixie-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: debian-13-lxqt, dir: debian, file: debian, base: "debian:trixie-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: debian-12-xfce, dir: debian, file: debian, base: "debian:12-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: debian-12-kde, dir: debian, file: debian, base: "debian:12-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: debian-12-mate, dir: debian, file: debian, base: "debian:12-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: debian-12-lxqt, dir: debian, file: debian, base: "debian:12-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: debian-11-xfce, dir: debian, file: debian, base: "debian:11-slim", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: kali-xfce, dir: kali, file: debian, base: "kalilinux/kali-rolling", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: kali-mate, dir: kali, file: debian, base: "kalilinux/kali-rolling", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: parrot-xfce, dir: parrot, file: debian, base: "parrotsec/core:latest", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: mint-xfce, dir: mint, file: debian, base: "linuxmintd/mint22-amd64", plat: "linux/amd64", args: '--build-arg "FF=mozilla" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: mint-mate, dir: mint, file: debian, base: "linuxmintd/mint22-amd64", plat: "linux/amd64", args: '--build-arg "FF=mozilla" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: devuan-xfce, dir: devuan, file: debian, base: "devuan/devuan:daedalus", plat: "linux/amd64,linux/arm64", args: '--build-arg "FF=esr" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: fedora-43-xfce, dir: fedora, file: rpm, base: "fedora:43", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: fedora-43-mate, dir: fedora, file: rpm, base: "fedora:43", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: fedora-43-lxqt, dir: fedora, file: rpm, base: "fedora:43", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: fedora-42-xfce, dir: fedora, file: rpm, base: "fedora:42", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: fedora-42-kde, dir: fedora, file: rpm, base: "fedora:42", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: fedora-42-mate, dir: fedora, file: rpm, base: "fedora:42", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: fedora-42-lxqt, dir: fedora, file: rpm, base: "fedora:42", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: fedora-41-xfce, dir: fedora, file: rpm, base: "fedora:41", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=0" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: rocky-9-xfce, dir: rocky, file: rpm, base: "rockylinux:9", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=1" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: alma-9-xfce, dir: alma, file: rpm, base: "almalinux:9", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=1" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: centos-9-xfce, dir: centos, file: rpm, base: "quay.io/centos/centos:stream9", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=1" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: oracle-9-xfce, dir: oracle, file: rpm, base: "oraclelinux:9", plat: "linux/amd64,linux/arm64", args: '--build-arg "EL=1" --build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: arch-xfce, dir: arch, file: arch, base: "archlinux:latest", plat: "linux/amd64", args: '--build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: arch-kde, dir: arch, file: arch, base: "archlinux:latest", plat: "linux/amd64", args: '--build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: arch-mate, dir: arch, file: arch, base: "archlinux:latest", plat: "linux/amd64", args: '--build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: arch-lxqt, dir: arch, file: arch, base: "archlinux:latest", plat: "linux/amd64", args: '--build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: arch-arm-xfce, dir: arch, file: arch, base: "menci/archlinuxarm:latest", plat: "linux/arm64", args: '--build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: arch-arm-kde, dir: arch, file: arch, base: "menci/archlinuxarm:latest", plat: "linux/arm64", args: '--build-arg "DE=kde" --build-arg "SESSION=env KWIN_COMPOSE=N startplasma-x11"' }
          - { tag: arch-arm-mate, dir: arch, file: arch, base: "menci/archlinuxarm:latest", plat: "linux/arm64", args: '--build-arg "DE=mate" --build-arg "SESSION=mate-session"' }
          - { tag: arch-arm-lxqt, dir: arch, file: arch, base: "menci/archlinuxarm:latest", plat: "linux/arm64", args: '--build-arg "DE=lxqt" --build-arg "SESSION=startlxqt"' }
          - { tag: manjaro-xfce, dir: manjaro, file: arch, base: "manjarolinux/base:latest", plat: "linux/amd64", args: '--build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: cachyos-xfce, dir: cachyos, file: arch, base: "cachyos/cachyos:latest", plat: "linux/amd64", args: '--build-arg "DE=xfce" --build-arg "SESSION=startxfce4"' }
          - { tag: alpine-321-xfce, dir: alpine, file: alpine, base: "alpine:3.21", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
          - { tag: alpine-320-xfce, dir: alpine, file: alpine, base: "alpine:3.20", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
          - { tag: alpine-edge-xfce, dir: alpine, file: alpine, base: "alpine:edge", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
          - { tag: opensuse-tw-xfce, dir: opensuse, file: suse, base: "opensuse/tumbleweed", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
          - { tag: opensuse-leap-xfce, dir: opensuse, file: suse, base: "opensuse/leap:15.6", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
          - { tag: void-xfce, dir: void, file: void, base: "ghcr.io/void-linux/void-glibc-full:latest", plat: "linux/amd64,linux/arm64", args: '--build-arg "SESSION=startxfce4"' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
      - name: build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          docker buildx build eggs/DeskForge/images -f eggs/DeskForge/images/${{ matrix.dir }}/Dockerfile \
            --build-arg BASE=${{ matrix.base }} ${{ matrix.args }} \
            --platform ${{ matrix.plat }} -t ghcr.io/$OWNER/deskforge:${{ matrix.tag }} --push
